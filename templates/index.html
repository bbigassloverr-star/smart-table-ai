<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Table AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <h1>📚 ระบบตรวจสอบโต๊ะว่าง AI</h1>

        <div class="summary">
            จำนวนโต๊ะว่าง: <span id="freeCount">0</span>
        </div>

        <div class="tables">
            <div id="A1" class="table free">
                <h2>A1</h2>
                <p>ว่าง</p>
            </div>

            <div id="A2" class="table occupied">
                <h2>A2</h2>
                <p>มีคนนั่ง</p>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
